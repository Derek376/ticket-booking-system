spring.application.name=ticket-booking

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:ticket_booking}}
spring.datasource.username=${DB_USERNAME:ticket_booking}
spring.datasource.password=${DB_PASSWORD:ticket_booking_local}

# Start with only the public health endpoint; add operational endpoints deliberately.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
